[project]
name = "documentation-assistant"
version = "0.1.0"
description = "Chat with any documentation site: crawl, index in Pinecone, ask with cited answers."
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "httpx<1",
    "langchain>=1.4.7",
    "langchain-openai",
    "langchain-pinecone",
    "langchain-tavily",
    "langchain-text-splitters",
    "pinecone",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = [
    "black",
    "ipykernel",
    "isort",
]

[tool.uv]
prerelease = "allow"
